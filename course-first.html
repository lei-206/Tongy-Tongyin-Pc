<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>“童语同音”学前儿童普通话师资培训 - 课程学习首次进入</title>
    <script type="module" src="/style/main.js"></script>
</head>
<body>
    <div class="page-wrapper">
        <!-- 顶部标题 -->
        <header class="page-header course-header-title">
            <img src="style/img/big-title.png" alt="“童语同音”学前儿童普通话师资培训" class="page-title-img">

            <!-- 右上角“我的”用户菜单 -->
            <div class="user-header-menu-wrap" id="userHeaderMenuWrap">
                <button type="button" class="user-menu-pill" id="userMenuBtn" aria-expanded="false" aria-haspopup="true">
                    <span class="user-pill-name">您好，张三</span>
                    <span class="user-pill-arrow">
                        <i data-lucide="chevron-down" class="pill-arrow-icon"></i>
                    </span>
                </button>
                <div class="user-dropdown-menu" id="userDropdownMenu">
                    <a href="my-courses.html" class="menu-item" id="menuItemMyCourse">
                        <i data-lucide="book-open" class="menu-item-icon"></i>
                        <span>我的课程</span>
                    </a>
                    <a href="javascript:void(0);" class="menu-item" id="menuItemChangePwd">
                        <i data-lucide="user" class="menu-item-icon"></i>
                        <span>修改密码</span>
                    </a>
                    <a href="javascript:void(0);" class="menu-item menu-item-logout" id="menuItemLogout">
                        <i data-lucide="log-out" class="menu-item-icon"></i>
                        <span>退出登录</span>
                    </a>
                </div>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="course-first-main-layout">
            <div class="course-first-card">
                <!-- 欢迎气泡横幅（含小机器人） -->
                <div class="welcome-robot-banner">
                    <img src="style/img/title-wel-bg.png" alt="" class="robot-banner-frame">
                    <img src="style/img/title-wel.png" alt="欢迎您开始“童语同音”学前儿童普通话师资培训 线上培训之旅" class="robot-banner-text">
                </div>

                <!-- 提示文字 -->
                <h2 class="course-first-prompt">在正式课程开始之前，请您完成普通话水平初测</h2>

                <!-- 初测按钮 -->
                <div class="course-first-action">
                    <a href="javascript:void(0);" class="btn-pth-test-wrap" id="btnStartPthTest" title="点击开始普通话水平初测">
                        <img src="style/img/btn-pth-test.png" alt="普通话水平初测" class="btn-pth-test-img">
                    </a>
                </div>

                <!-- 声明备注 -->
                <p class="course-first-disclaimer">本测试为模拟测试，与普通话等级评定无关</p>
            </div>
        </main>

        <!-- 页面底部 -->
        <footer class="page-footer">
            <p>网络教育数字化学习资源中心 版权所有</p>
            <p>技术支持：国开泛在（北京）教育科技有限公司</p>
            <p>ICP备xxxxxxxx号 公安网备xxxxxx号</p>
        </footer>

        <!-- AI伴学悬浮球 -->
        <div class="ai-companion-btn" id="aiCompanionBtn" title="点击呼唤AI伴学小助手">
            <img src="style/img/AI-companion.png" alt="AI伴学">
        </div>
    </div>
</body>
</html>
