<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>“童语同音”学前儿童普通话师资培训 - 重置密码</title>
    <script type="module" src="/style/main.js"></script>
</head>
<body>
    <div class="login-page-body">
    <!-- 顶部标题图片 -->
    <header class="login-header">
        <img src="style/img/login-title.png" alt="欢迎进入“童语同音”学前儿童普通话师资培训线上培训平台" class="login-title-img">
    </header>

    <!-- 中间重置密码卡片 -->
    <main class="login-card-container">
        <div class="login-capsule-card">
            <h2 class="login-card-title">重置密码</h2>

            <!-- 步骤一：手机号与短信验证码 -->
            <form class="login-form" id="resetStep1Form" onsubmit="return false;">
                <!-- 手机号输入行 -->
                <div class="login-input-group">
                    <span class="input-icon-wrap">
                        <img src="style/img/icon-login-user.png" alt="手机号">
                    </span>
                    <span class="input-label-text">手机号</span>
                    <input type="tel" id="resetPhone" class="login-field-input" placeholder="报名时的手机号" maxlength="11" autocomplete="tel">
                </div>

                <!-- 短信验证码行 -->
                <div class="login-input-group login-input-group-sms">
                    <span class="input-icon-wrap">
                        <i data-lucide="shield-check"></i>
                    </span>
                    <span class="input-label-text">验证码</span>
                    <input type="text" id="resetCode" class="login-field-input" placeholder="请输入短信验证码" maxlength="6" autocomplete="one-time-code">
                    <button type="button" id="btnGetResetCode" class="btn-sms-inside">获取验证码</button>
                </div>

                <!-- 下一步操作按钮 -->
                <button type="submit" id="btnResetNext" class="btn-login-submit btn-reset-step">下一步</button>

                <!-- 返回登录 -->
                <div class="login-options-row login-link-center">
                    <a href="login.html" class="forget-pwd-link">想起密码？返回登录</a>
                </div>
            </form>

            <!-- 步骤二：设置新密码（默认隐藏） -->
            <form class="login-form" id="resetStep2Form" style="display: none;" onsubmit="return false;">
                <!-- 新密码行 -->
                <div class="login-input-group">
                    <span class="input-icon-wrap">
                        <img src="style/img/icon-login-psw.png" alt="新密码">
                    </span>
                    <span class="input-label-text">新密码</span>
                    <input type="password" id="resetNewPwd" class="login-field-input" placeholder="请输入6-18位新密码" autocomplete="new-password">
                </div>

                <!-- 确认密码行 -->
                <div class="login-input-group">
                    <span class="input-icon-wrap">
                        <img src="style/img/icon-login-psw.png" alt="确认密码">
                    </span>
                    <span class="input-label-text">确认密码</span>
                    <input type="password" id="resetConfirmPwd" class="login-field-input" placeholder="请再次输入新密码" autocomplete="new-password">
                </div>

                <!-- 完成重置按钮 -->
                <button type="submit" id="btnResetSubmit" class="btn-login-submit btn-reset-finish">完成重置</button>

                <!-- 返回上一步 -->
                <div class="login-options-row login-link-center">
                    <a href="javascript:void(0);" id="btnBackToStep1" class="forget-pwd-link">返回上一步</a>
                </div>
            </form>
        </div>
    </main>

    <!-- 底部版权信息 -->
    <footer class="page-footer">
        <p>网络教育数字化学习资源中心 版权所有</p>
        <p>技术支持：国开泛在（北京）教育科技有限公司</p>
        <p>ICP备xxxxxxxx号 公安网备xxxxxx号</p>
    </footer>
</div>
</body>
</html>
